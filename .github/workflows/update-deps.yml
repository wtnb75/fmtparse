name: update-deps

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: wtnb75/actions/python@v1
    - uses: wtnb75/actions/pyupdate@v1
      with:
        test-args: "-xs"
